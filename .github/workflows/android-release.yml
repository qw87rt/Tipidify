name: Android Release (CI/CD)

on:
  # Trigger automatically when code is pushed to the main branch
  push:
    branches: [ main ]
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    
    # Optional: Add environment protection for production (requires manual approval)
    # environment: production

    steps:
      # 1. Checkout your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Expo works well with Node 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      # 3. Setup Java (Required for Android builds)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Setup Expo CLI with your secret token
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO }}

      # 6. Install dependencies (uses clean install for reliability)
      - name: Install dependencies
        run: npm ci --frozen-lockfile

      # 7. (Optional) Run Linting & Unit Tests
      # Uncomment if you have tests configured
      # - name: Run tests
      #   run: npm test

      # 8. Build the Android AAB (App Bundle) using your production profile
      # This will automatically pick up targetSdkVersion 36 from app.json
      - name: Build Android app
        run: eas build --platform android --profile production --non-interactive

      # 9. Submit the built app to Google Play Console
      # IMPORTANT: I recommend submitting to "internal" or "beta" first for testing!
      - name: Submit to Google Play
        run: eas submit --platform android --profile production --non-interactive